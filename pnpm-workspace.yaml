packages:
  - apps/*
  - packages/*

allowBuilds:
  # acpxが依存するtsxのバンドラ。プラットフォーム別のバイナリは
  # optionalDependenciesから解決するため、postinstallは実行しない。
  esbuild: false
  # PIのGoogleプロバイダが依存する@google/genai（と依存のprotobufjs）のpostinstall。
  # 配布物に含まれるビルド済みのコードを使うため実行しない。
  "@google/genai": false
  protobufjs: false
catalog:
  # パッケージ間で同じツールチェーンを使うため、バージョンはここで固定する。
  "@types/node": ^26.6.5
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.3.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.3.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.3.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.3.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.3.0"
  - vite-plus@1.3.0
  - openai@7.36.0
  - "@ai-sdk/anthropic@4.0.82"
  - "@ai-sdk/cerebras@3.0.71"
  - "@ai-sdk/deepseek@3.0.67"
  - "@ai-sdk/fireworks@3.0.74"
  - "@ai-sdk/google@4.0.99"
  - "@ai-sdk/groq@4.0.63"
  - "@ai-sdk/mistral@4.0.66"
  - "@ai-sdk/moonshotai@3.0.71"
  - "@ai-sdk/openai-compatible@3.0.71"
  - "@ai-sdk/openai@4.0.96"
  - "@ai-sdk/provider-utils@5.0.62"
  - "@ai-sdk/provider@4.0.29"
  - "@ai-sdk/togetherai@3.0.72"
  - "@ai-sdk/xai@5.0.24"
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
permissions:
  acpx:
    skills: true
